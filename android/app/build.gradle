plugins { id 'com.android.application' }

// Owner-signed test successor to v1.0.0-preview.7 (Android versionCode 7).
def candidateReleaseTag = 'v1.0.0-preview.8'
def candidateVersionCode = 8

// Release packages require an owner-provided key and an explicitly pinned certificate.
// Debug builds remain available for local testing; neither can be published as an update.
// SHA-256 of the DER-encoded public certificate exported from the owner keystore.
// The private keystore and its password remain outside all repositories.
def pinnedOwnerReleaseCertSha256 = '4a307e802e3504f7850c546ab8b38c292211ea5d5c5be3342107edaec1255fff'
def releaseTaskRequested = gradle.startParameter.taskNames.any { taskName ->
    def name = taskName.tokenize(':').last()
    name.toLowerCase(java.util.Locale.ROOT).contains('release') || name in ['assemble', 'build', 'bundle']
}
// Produce an explicitly unsigned local release-variant artifact when the owner
// signing material is unavailable. This cannot pass signed-release verification.
def unsignedReleaseArtifact = project.hasProperty('unsignedReleaseArtifact')
if (unsignedReleaseArtifact && !releaseTaskRequested)
    throw new GradleException('unsignedReleaseArtifact requires an explicit release build task')
// Gradle accepts abbreviated task names (for example assembleRel). Resolve the
// actual graph too, so an abbreviation cannot package an unsigned release.
gradle.taskGraph.whenReady { graph ->
    if (!releaseTaskRequested && graph.allTasks.any { task ->
        task.project == project && task.name.toLowerCase(java.util.Locale.ROOT).contains('release')
    }) throw new GradleException('Release task requires explicit owner signing configuration')
}
def releaseSigning = [:]
if (releaseTaskRequested) {
    if (candidateVersionCode <= 7 || !(candidateReleaseTag ==~ /v[0-9]+\.[0-9]+\.[0-9]+-preview\.[0-9]+/))
        throw new GradleException('Release metadata must advance beyond the published preview')
    if (!unsignedReleaseArtifact) {
        def names = ['BLOCKNET_RELEASE_KEYSTORE', 'BLOCKNET_RELEASE_STORE_PASSWORD',
                     'BLOCKNET_RELEASE_KEY_ALIAS', 'BLOCKNET_RELEASE_KEY_PASSWORD',
                     'BLOCKNET_RELEASE_CERT_SHA256']
        names.each { name ->
            def value = providers.environmentVariable(name).orNull
            if (value == null || value.isEmpty())
                throw new GradleException("Signed release build requires $name")
            releaseSigning[name] = value
        }
        def keyFile = new File(releaseSigning.BLOCKNET_RELEASE_KEYSTORE)
        if (!keyFile.isAbsolute() || !keyFile.isFile())
            throw new GradleException('Release keystore must be an existing absolute file')
        def expected = releaseSigning.BLOCKNET_RELEASE_CERT_SHA256.toLowerCase(java.util.Locale.ROOT)
        if (!(expected ==~ /[0-9a-f]{64}/))
            throw new GradleException('Release certificate SHA-256 must be 64 hexadecimal characters')
        if (!(pinnedOwnerReleaseCertSha256 ==~ /[0-9a-f]{64}/) || expected != pinnedOwnerReleaseCertSha256)
            throw new GradleException('Release certificate is not the pinned owner certificate')
        try {
            def keyStore = java.security.KeyStore.getInstance(keyFile,
                releaseSigning.BLOCKNET_RELEASE_STORE_PASSWORD.toCharArray())
            def alias = releaseSigning.BLOCKNET_RELEASE_KEY_ALIAS
            if (!keyStore.isKeyEntry(alias) || keyStore.getCertificate(alias) == null)
                throw new GradleException('Release key alias is missing')
            def actual = java.security.MessageDigest.getInstance('SHA-256')
                .digest(keyStore.getCertificate(alias).getEncoded()).encodeHex().toString()
            if (actual != expected) throw new GradleException('Release signing certificate does not match the pinned SHA-256')
        } catch (GradleException error) { throw error }
        catch (Exception error) { throw new GradleException('Release signing material could not be validated', error) }
    }
}

// Every APK requires an explicit, provenance-checked build of the pinned mobile Core.
if (project.hasProperty('coreActivityDir'))
    throw new GradleException('Activity-only Core is retired; select the reviewed mobile Core')
def mobileDirArgument = providers.gradleProperty('coreMobileDir').orNull
def mobileDirectory = mobileDirArgument == null ? null : new File(mobileDirArgument)
if (mobileDirectory != null && (!mobileDirectory.isAbsolute() || !mobileDirectory.isDirectory()))
    throw new GradleException('coreMobileDir must name an existing absolute experimental build directory')
if (mobileDirectory == null)
    throw new GradleException('Every APK requires -PcoreMobileDir=/absolute/reviewed-mobile-build')
def coreMobileEnabled = true
def activityDirectory = mobileDirectory
def coreActivityEnabled = true
def bootstrapQaEnabled = project.hasProperty('bootstrapIntegration')
if (bootstrapQaEnabled && releaseTaskRequested)
    throw new GradleException('Controlled-peer bootstrap QA must never build a release APK')
// Public owner pin. The private Ed25519 signer stays outside all repositories.
def pinnedAnnouncementSigner = '333c7c85db80716deceb4da838b5ae3145ee4b0ed0a64966f60aa56e12972b16'
// Dedicated mainnet announcement address KNNpZhPcJX92oAyvcVWJhQXJjsWRYsEiPHej6ZTM2LuSJBDS3VQebjUjUCzYqBnidt1JXYUiUgA69HeBoTuVuQYWwnhQN.
// The view private key is deliberately public so every app can recognize channel outputs.
// The channel spend private key remains outside Git and is never used by this app.
def pinnedAnnouncementViewPriv = 'a887e975d9374b75fe36e4cd828f6333599f195b9fe2544b2329ffeb51300204'
def pinnedAnnouncementSpendPub = '8c66dd904be0ef4ecc9b48c3a4710af0b8a0b485387a9fbd7ffd64596eb6c34c'
def pinnedAnnouncementBirthHeight = '66200'
def announcementNames = ['BLOCKNET_ANNOUNCEMENT_PRIMARY_PUB', 'BLOCKNET_ANNOUNCEMENT_VIEW_PRIV',
                         'BLOCKNET_ANNOUNCEMENT_SPEND_PUB', 'BLOCKNET_ANNOUNCEMENT_BIRTH_HEIGHT',
                         'BLOCKNET_ANNOUNCEMENT_APK_CERT_SHA256']
def announcement = announcementNames.collectEntries { [(it): providers.environmentVariable(it).orNull ?: ''] }
def announcementReady = announcement.values().every { !it.isEmpty() }
if (announcement.values().any { !it.isEmpty() } && !announcementReady)
    throw new GradleException('Announcement channel configuration must supply all five fields together')
if (announcementReady) {
    ['BLOCKNET_ANNOUNCEMENT_PRIMARY_PUB', 'BLOCKNET_ANNOUNCEMENT_VIEW_PRIV',
     'BLOCKNET_ANNOUNCEMENT_SPEND_PUB', 'BLOCKNET_ANNOUNCEMENT_APK_CERT_SHA256'].each { name ->
        if (!(announcement[name] ==~ /[0-9a-fA-F]{64}/)) throw new GradleException("Invalid $name")
    }
    if (!(announcement.BLOCKNET_ANNOUNCEMENT_BIRTH_HEIGHT ==~ /[1-9][0-9]{0,12}/))
        throw new GradleException('Invalid announcement birth height')
    if (!announcement.BLOCKNET_ANNOUNCEMENT_PRIMARY_PUB.equalsIgnoreCase(pinnedAnnouncementSigner))
        throw new GradleException('Announcement signer does not match the pinned owner public key')
    if (!announcement.BLOCKNET_ANNOUNCEMENT_VIEW_PRIV.equalsIgnoreCase(pinnedAnnouncementViewPriv) ||
        !announcement.BLOCKNET_ANNOUNCEMENT_SPEND_PUB.equalsIgnoreCase(pinnedAnnouncementSpendPub) ||
        announcement.BLOCKNET_ANNOUNCEMENT_BIRTH_HEIGHT != pinnedAnnouncementBirthHeight)
        throw new GradleException('Announcement channel does not match the validated mainnet address and birth height')
    if (!announcement.BLOCKNET_ANNOUNCEMENT_APK_CERT_SHA256.equalsIgnoreCase(pinnedOwnerReleaseCertSha256))
        throw new GradleException('Announcement APK certificate does not match the pinned owner certificate')
}
if (releaseTaskRequested && (!coreMobileEnabled || !announcementReady ||
    (!unsignedReleaseArtifact && !announcement.BLOCKNET_ANNOUNCEMENT_APK_CERT_SHA256.equalsIgnoreCase(releaseSigning.BLOCKNET_RELEASE_CERT_SHA256))))
    throw new GradleException('Signed release requires the reviewed mobile Core and a complete announcement channel bound to its certificate')
def selectedCore = new File(activityDirectory, 'blocknet-core-arm64-android-experimental')
def activityProvenance = new File(activityDirectory, 'build-provenance.json')
def activityPatch = rootProject.file('core-patches/0001-locked-wallet-activity.patch')
def activityShim = rootProject.file('core-patches/0002-android-cgo-link-flags.patch')
def announcementPatch = rootProject.file('core-patches/0003-onchain-announcement-scan.patch')
def mobilePatch = rootProject.file('core-patches/0004-mobile-client-policy.patch')
def walletPersistencePatch = rootProject.file('core-patches/0005-core-wallet-persistence.patch')
def walletScanPatch = rootProject.file('core-patches/0006-core-wallet-scan-serialization.patch')
def walletReadinessPatch = rootProject.file('core-patches/0007-core-wallet-send-readiness.patch')
def walletFollowupPatch = rootProject.file('core-patches/0008-core-wallet-send-reorg-activity.patch')
def walletOverflowPatch = rootProject.file('core-patches/0009-core-wallet-notification-overflow.patch')
def bootstrapPatch = rootProject.file('core-patches/0010-bootstrap-progress.patch')
def fetchedScanPatch = rootProject.file('core-patches/0011-fetched-block-wallet-scan.patch')
def birthRescanPatch = rootProject.file('core-patches/0012-wallet-birth-rescan.patch')
def bootstrapQaPatch = rootProject.file('qa/controlled-peer.patch')
def offlineViewArgument = providers.gradleProperty('offlineWalletViewDir').orNull
def offlineViewDirectory = offlineViewArgument == null ? null : new File(offlineViewArgument)
def offlineViewBinary = offlineViewDirectory == null ? null : new File(offlineViewDirectory, 'blocknet-wallet-view-arm64-android')
def offlineViewProvenance = offlineViewDirectory == null ? null : new File(offlineViewDirectory, 'build-provenance.json')
def sha256 = { File input -> java.security.MessageDigest.getInstance('SHA-256').digest(input.bytes).encodeHex().toString() }
def validateActivity = {
    if (!coreActivityEnabled) return
    def required = [selectedCore, activityProvenance, activityPatch, activityShim, announcementPatch,
                    new File(activityDirectory, 'Cargo.lock'), new File(activityDirectory, 'applied.patch'),
                    new File(activityDirectory, 'android-cgo-link-flags.patch'),
                    new File(activityDirectory, 'onchain-announcement-scan.patch')]
    if (coreMobileEnabled) required += [mobilePatch, new File(activityDirectory, 'mobile-client-policy.patch'),
        walletPersistencePatch, walletScanPatch, walletReadinessPatch, walletFollowupPatch, walletOverflowPatch, bootstrapPatch, fetchedScanPatch, birthRescanPatch,
        new File(activityDirectory, walletPersistencePatch.name),
        new File(activityDirectory, walletScanPatch.name),
        new File(activityDirectory, walletReadinessPatch.name),
        new File(activityDirectory, walletFollowupPatch.name),
        new File(activityDirectory, walletOverflowPatch.name),
        new File(activityDirectory, bootstrapPatch.name),
        new File(activityDirectory, fetchedScanPatch.name),
        new File(activityDirectory, birthRescanPatch.name)]
    if (bootstrapQaEnabled) required += [bootstrapQaPatch,
        new File(activityDirectory, 'controlled-peer.patch'),
        new File(activityDirectory, 'reviewed-build-provenance.json')]
    required.each { if (!it.isFile()) throw new GradleException("Missing experimental Core build input: $it") }
    def provenance
    try { provenance = new groovy.json.JsonSlurper().parse(activityProvenance) }
    catch (Exception error) { throw new GradleException('Invalid experimental Core build provenance', error) }
    if (!(provenance instanceof Map) || provenance.experimental != true ||
        provenance.baseline_repository != 'https://github.com/blocknetprivacy/core' ||
        provenance.baseline_commit != '5a37ed52f0426951eaac2f0ae86bf0bb6d70a83e') {
        throw new GradleException('Experimental Core provenance must identify the reviewed activity API baseline')
    }
    def expected = [binary_sha256: selectedCore,
                    patch_sha256: activityPatch, android_link_shim_sha256: activityShim,
                    announcement_scan_patch_sha256: announcementPatch,
                    cargo_lock_sha256: file('../core-patches/core-activity.Cargo.lock')]
    if (coreMobileEnabled) expected += [mobile_client_patch_sha256: mobilePatch,
        wallet_persistence_patch_sha256: walletPersistencePatch,
        wallet_scan_patch_sha256: walletScanPatch,
        wallet_send_readiness_patch_sha256: walletReadinessPatch,
        wallet_followup_patch_sha256: walletFollowupPatch,
        wallet_notification_overflow_patch_sha256: walletOverflowPatch,
        bootstrap_progress_patch_sha256: bootstrapPatch,
        fetched_block_wallet_scan_patch_sha256: fetchedScanPatch,
        wallet_birth_rescan_patch_sha256: birthRescanPatch]
    if (bootstrapQaEnabled) expected += [qa_peer_only_patch_sha256: bootstrapQaPatch,
        reviewed_base_provenance_sha256: new File(activityDirectory, 'reviewed-build-provenance.json')]
    expected.each { field, input ->
        if (!(provenance[field] instanceof String) || !(provenance[field] ==~ /[0-9a-f]{64}/) || provenance[field] != sha256(input))
            throw new GradleException("Experimental Core provenance $field does not match $input")
    }
    if (sha256(new File(activityDirectory, 'applied.patch')) != provenance.patch_sha256 ||
        sha256(new File(activityDirectory, 'android-cgo-link-flags.patch')) != provenance.android_link_shim_sha256 ||
        sha256(new File(activityDirectory, 'onchain-announcement-scan.patch')) != provenance.announcement_scan_patch_sha256 ||
        sha256(new File(activityDirectory, 'Cargo.lock')) != provenance.cargo_lock_sha256)
        throw new GradleException('Experimental build patch copies differ from the reviewed source patches')
    def normalPatchOrder = ['0001-locked-wallet-activity.patch', '0002-android-cgo-link-flags.patch', '0003-onchain-announcement-scan.patch', '0004-mobile-client-policy.patch', walletPersistencePatch.name, walletScanPatch.name, walletReadinessPatch.name, walletFollowupPatch.name, walletOverflowPatch.name, bootstrapPatch.name, fetchedScanPatch.name, birthRescanPatch.name]
    if (coreMobileEnabled && (provenance.mobile_client_capability != 1 ||
        provenance.patch_order != (bootstrapQaEnabled ? normalPatchOrder + ['qa/controlled-peer.patch'] : normalPatchOrder) ||
        sha256(new File(activityDirectory, 'mobile-client-policy.patch')) != provenance.mobile_client_patch_sha256 ||
        sha256(new File(activityDirectory, walletPersistencePatch.name)) != provenance.wallet_persistence_patch_sha256 ||
        sha256(new File(activityDirectory, walletScanPatch.name)) != provenance.wallet_scan_patch_sha256 ||
        sha256(new File(activityDirectory, walletReadinessPatch.name)) != provenance.wallet_send_readiness_patch_sha256 ||
        sha256(new File(activityDirectory, walletFollowupPatch.name)) != provenance.wallet_followup_patch_sha256 ||
        sha256(new File(activityDirectory, walletOverflowPatch.name)) != provenance.wallet_notification_overflow_patch_sha256 ||
        sha256(new File(activityDirectory, bootstrapPatch.name)) != provenance.bootstrap_progress_patch_sha256 ||
        sha256(new File(activityDirectory, fetchedScanPatch.name)) != provenance.fetched_block_wallet_scan_patch_sha256 ||
        sha256(new File(activityDirectory, birthRescanPatch.name)) != provenance.wallet_birth_rescan_patch_sha256))
        throw new GradleException('Mobile Core capability or ordered patch provenance is invalid')
    if (bootstrapQaEnabled) {
        def base = new groovy.json.JsonSlurper().parse(new File(activityDirectory, 'reviewed-build-provenance.json'))
        if (provenance.qa_peer_only_capability != 1 || provenance.qa_only != true ||
            provenance.base_binary_sha256 != base.binary_sha256 ||
            sha256(new File(activityDirectory, 'controlled-peer.patch')) != provenance.qa_peer_only_patch_sha256)
            throw new GradleException('Controlled-peer QA Core provenance is invalid')
    } else if (provenance.qa_only == true || provenance.qa_peer_only_patch_sha256 != null)
        throw new GradleException('Normal APK unexpectedly contains controlled-peer QA Core')
    if (!coreMobileEnabled && provenance.mobile_client_patch_sha256 != null)
        throw new GradleException('Activity variant unexpectedly contains mobile Core patch')
}
validateActivity()
def validateOfflineView = {
    if (offlineViewDirectory == null || !offlineViewDirectory.isAbsolute() || !offlineViewDirectory.isDirectory())
        throw new GradleException('Build the pinned offline wallet helper and pass -PofflineWalletViewDir=/absolute/build/directory')
    if (!offlineViewBinary.isFile() || !offlineViewProvenance.isFile())
        throw new GradleException('Offline wallet helper binary or provenance is missing')
    def provenance
    try { provenance = new groovy.json.JsonSlurper().parse(offlineViewProvenance) }
    catch (Exception error) { throw new GradleException('Invalid offline wallet helper provenance', error) }
    def expected = [binary_sha256: offlineViewBinary,
                    helper_source_sha256: rootProject.file('offline-wallet-view/main.go'),
                    helper_test_sha256: rootProject.file('offline-wallet-view/main_test.go')]
    if (!(provenance instanceof Map) || provenance.baseline_commit != '5a37ed52f0426951eaac2f0ae86bf0bb6d70a83e' ||
        expected.any { field, input -> provenance[field] != sha256(input) })
        throw new GradleException('Offline wallet helper provenance does not match the pinned source and binary')
}

// Android extracts these PIE executables into its executable native library directory.
// Sync both outputs explicitly, including removal of an experimental asset on default builds.
def bundledNative = layout.buildDirectory.dir('generated/blocknetNative')
def activityAssets = layout.buildDirectory.dir('generated/blocknetCoreActivityAssets')
tasks.register('prepareBlocknetBinaries') {
    inputs.files(selectedCore, activityPatch, activityShim, announcementPatch)
    if (coreMobileEnabled) inputs.files(mobilePatch, new File(activityDirectory, 'mobile-client-policy.patch'),
        walletPersistencePatch, walletScanPatch, walletReadinessPatch, walletFollowupPatch, walletOverflowPatch, bootstrapPatch, fetchedScanPatch,
        new File(activityDirectory, walletPersistencePatch.name), new File(activityDirectory, walletScanPatch.name),
        new File(activityDirectory, walletReadinessPatch.name), new File(activityDirectory, walletFollowupPatch.name),
        new File(activityDirectory, walletOverflowPatch.name), new File(activityDirectory, bootstrapPatch.name),
        new File(activityDirectory, fetchedScanPatch.name))
    if (bootstrapQaEnabled) inputs.files(bootstrapQaPatch, new File(activityDirectory, 'controlled-peer.patch'),
        new File(activityDirectory, 'reviewed-build-provenance.json'))
    if(offlineViewDirectory != null) inputs.files(offlineViewBinary,offlineViewProvenance)
    inputs.files(rootProject.file('offline-wallet-view/main.go'),rootProject.file('offline-wallet-view/main_test.go'))
    if (coreActivityEnabled) inputs.files(activityProvenance, new File(activityDirectory, 'Cargo.lock'), new File(activityDirectory, 'applied.patch'), new File(activityDirectory, 'android-cgo-link-flags.patch'), new File(activityDirectory, 'onchain-announcement-scan.patch'))
    inputs.property('coreActivityEnabled', coreActivityEnabled)
    inputs.property('coreMobileEnabled', coreMobileEnabled)
    outputs.dir(bundledNative)
    outputs.dir(activityAssets)
    doLast {
        validateActivity()
        validateOfflineView()
        [selectedCore].each {
            if (!it.isFile()) throw new GradleException("Required Android executable is missing: $it")
        }
        project.delete(bundledNative.get().asFile, activityAssets.get().asFile)
        def nativeDirectory = bundledNative.get().dir('arm64-v8a').asFile
        nativeDirectory.mkdirs()
        activityAssets.get().asFile.mkdirs()
        project.copy { from selectedCore; into nativeDirectory; rename { 'libblocknet_core.so' } }
        project.copy { from offlineViewBinary; into nativeDirectory; rename { 'libblocknet_walletview.so' } }
        project.copy { from offlineViewProvenance; into activityAssets.get().asFile; rename { 'offline-wallet-view-build-provenance.json' } }
        if (coreActivityEnabled) project.copy { from activityProvenance; into activityAssets.get().asFile; rename { coreMobileEnabled ? 'core-mobile-build-provenance.json' : 'core-activity-build-provenance.json' } }
    }
}

if (['addressBookIntegration','isolatedDeviceIntegration','bootstrapIntegration'].count { project.hasProperty(it) } > 1) {
    throw new GradleException('Choose one isolated instrumentation runner')
}
def addressBookSidecar = project.hasProperty('addressBookIntegration') || project.hasProperty('isolatedDeviceIntegration') || project.hasProperty('bootstrapIntegration')
if (addressBookSidecar && project.findProperty('isolatedTestApplicationId') != 'com.blocknet.wallet.offlinetest') {
    throw new GradleException('Isolated instrumentation requires -PisolatedTestApplicationId=com.blocknet.wallet.offlinetest')
}
if (unsignedReleaseArtifact && addressBookSidecar)
    throw new GradleException('Unsigned release artifact must use the production application ID')
def sidecarVersion = providers.gradleProperty('isolatedTestVersionCode').orNull ?: '2'
if (addressBookSidecar && !(sidecarVersion in ['2','3'])) {
    throw new GradleException('Isolated address-book test version must be 2 or 3')
}

android {
    namespace 'com.blocknet.wallet'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId addressBookSidecar ? 'com.blocknet.wallet.offlinetest' : 'com.blocknet.wallet'
        manifestPlaceholders = [
            walletLauncherLabel: addressBookSidecar ? '@string/app_name_offlinetest' : '@string/app_name',
            walletLauncherIcon: addressBookSidecar ? '@mipmap/ic_launcher_offlinetest' : '@mipmap/ic_launcher',
            paymentLinkEnabled: addressBookSidecar ? 'false' : 'true'
        ]
        minSdk 26
        targetSdk 36
        versionCode addressBookSidecar ? sidecarVersion.toInteger() : candidateVersionCode
        versionName candidateReleaseTag.substring(1) + (addressBookSidecar ? '-offline-test' : '')
        // Update this tag alongside the next published preview release.
        buildConfigField 'String', 'RELEASE_TAG', '"' + candidateReleaseTag + '"'
        testInstrumentationRunner project.hasProperty('bootstrapIntegration') ? 'com.blocknet.wallet.WalletBootstrapInstrumentation' : project.hasProperty('isolatedDeviceIntegration') ? 'com.blocknet.wallet.WalletDeviceInstrumentation' : project.hasProperty('languageIntegration') ? 'com.blocknet.wallet.WalletLanguageInstrumentation' : project.hasProperty('addressBookIntegration') ? 'com.blocknet.wallet.AddressBookKeystoreInstrumentation' : project.hasProperty('activityIntegration') ? 'com.blocknet.wallet.WalletActivityInstrumentation' : project.hasProperty('cameraIntegration') ? 'com.blocknet.wallet.WalletCameraInstrumentation' : project.hasProperty('notificationIntegration') ? 'com.blocknet.wallet.WalletNotificationInstrumentation' : project.hasProperty('shortnameIntegration') ? 'com.blocknet.wallet.ShortnameVerificationInstrumentation' : project.hasProperty('biometricIntegration') ? 'com.blocknet.wallet.WalletBiometricInstrumentation' : project.hasProperty('networkIntegration') ? 'com.blocknet.wallet.WalletNetworkInstrumentation' : project.hasProperty('identityIntegration') ? 'com.blocknet.wallet.WalletIdentityInstrumentation' : project.hasProperty('checkpointIntegration') ? 'com.blocknet.wallet.WalletCheckpointInstrumentation' : project.hasProperty('deviceIntegration') ? 'com.blocknet.wallet.WalletDeviceInstrumentation' : project.hasProperty('apiIntegration') ? 'com.blocknet.wallet.WalletApiInstrumentation' : 'com.blocknet.wallet.WalletSmokeInstrumentation'
        ndk { abiFilters 'arm64-v8a' }
        buildConfigField 'String', 'CORE_VERSION', coreMobileEnabled ? '"0.22.0-mobile1"' : coreActivityEnabled ? '"0.22.0-activity1"' : '"0.22.0"'
        buildConfigField 'boolean', 'CORE_ACTIVITY_API', coreActivityEnabled.toString()
        buildConfigField 'boolean', 'CORE_MOBILE_CLIENT', coreMobileEnabled.toString()
        buildConfigField 'boolean', 'BOOTSTRAP_QA', bootstrapQaEnabled.toString()
        buildConfigField 'boolean', 'ANNOUNCEMENT_ENABLED', (coreActivityEnabled && announcementReady).toString()
        buildConfigField 'String', 'ANNOUNCEMENT_PRIMARY_PUB', '"' + pinnedAnnouncementSigner + '"'
        buildConfigField 'String', 'ANNOUNCEMENT_VIEW_PRIV', '"' + (announcementReady ? pinnedAnnouncementViewPriv : '') + '"'
        buildConfigField 'String', 'ANNOUNCEMENT_SPEND_PUB', '"' + (announcementReady ? pinnedAnnouncementSpendPub : '') + '"'
        buildConfigField 'String', 'ANNOUNCEMENT_APK_CERT_SHA256', '"' + pinnedOwnerReleaseCertSha256 + '"'
        buildConfigField 'long', 'ANNOUNCEMENT_BIRTH_HEIGHT', announcementReady ? pinnedAnnouncementBirthHeight + 'L' : '0L'
    }
    sourceSets.main.jniLibs.srcDirs = [bundledNative]
    sourceSets.main.assets.srcDir(activityAssets)
    signingConfigs {
        if (releaseTaskRequested && !unsignedReleaseArtifact) {
            ownerRelease {
                storeFile file(releaseSigning.BLOCKNET_RELEASE_KEYSTORE)
                storePassword releaseSigning.BLOCKNET_RELEASE_STORE_PASSWORD
                keyAlias releaseSigning.BLOCKNET_RELEASE_KEY_ALIAS
                keyPassword releaseSigning.BLOCKNET_RELEASE_KEY_PASSWORD
            }
        }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging {
        jniLibs {
            useLegacyPackaging = true
            keepDebugSymbols += ['**/libblocknet_core.so', '**/libblocknet_walletview.so']
        }
    }
    buildTypes {
        release {
            if (releaseTaskRequested && !unsignedReleaseArtifact) signingConfig signingConfigs.ownerRelease
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    lint { abortOnError true }
}

tasks.named('preBuild').configure { dependsOn 'prepareBlocknetBinaries' }
dependencies {
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'org.bouncycastle:bcprov-jdk15to18:1.86'
    implementation('com.google.code.gson:gson:2.11.0') {
        exclude group: 'com.google.errorprone', module: 'error_prone_annotations'
    }
    testImplementation 'junit:junit:4.13.2'
}
