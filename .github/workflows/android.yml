name: Build Android APK

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      sign_release:
        description: 'Build owner-signed APK from the selected v* tag'
        type: boolean
        default: false
      publish_release:
        description: 'Publish the signed APK after a separate environment approval'
        type: boolean
        default: false
      confirm_publish_tag:
        description: 'For publication only, type the exact selected release tag again'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.sign_release && 'owner-release' || 'ci' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' || !inputs.sign_release }}

jobs:
  apk:
    name: Reviewed mobile Core APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '12266719'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.5'
          cache: false

      - name: Fetch exact pinned Core revision and build offline wallet reader
        run: |
          git init "$RUNNER_TEMP/blocknet-core-source"
          git -C "$RUNNER_TEMP/blocknet-core-source" remote add origin https://github.com/blocknetprivacy/core.git
          git -C "$RUNNER_TEMP/blocknet-core-source" fetch --depth 1 origin 5a37ed52f0426951eaac2f0ae86bf0bb6d70a83e
          git -C "$RUNNER_TEMP/blocknet-core-source" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/blocknet-core-source" rev-parse HEAD)" = 5a37ed52f0426951eaac2f0ae86bf0bb6d70a83e
          bash android/scripts/build-offline-wallet-view.sh \
            "$RUNNER_TEMP/blocknet-core-source" "$RUNNER_TEMP/offline-wallet-view"

      - name: Build mobile Core from ordered reviewed patches
        run: |
          sdkmanager 'ndk;30.0.16248370'
          rustup toolchain install 1.89.0 --profile minimal --target aarch64-linux-android
          export RUSTUP_TOOLCHAIN=1.89.0
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/30.0.16248370"
          bash android/scripts/build-core-android.sh \
            "$RUNNER_TEMP/blocknet-core-source" "$RUNNER_TEMP/core-mobile" \
            "$GITHUB_WORKSPACE/android/core-patches/0001-locked-wallet-activity.patch" \
            "$GITHUB_WORKSPACE/android/core-patches/0004-mobile-client-policy.patch"

      - name: Test, lint, package and verify mobile APK
        run: |
          cd android
          python3 -m unittest discover -s scripts -p 'test_apk_launcher.py'
          python3 -m unittest discover -s scripts -p 'test_release_checks.py'
          python3 -m unittest discover -s scripts -p 'test_localization.py'
          ./gradlew --no-daemon \
            -PcoreMobileDir="$RUNNER_TEMP/core-mobile" \
            -PofflineWalletViewDir="$RUNNER_TEMP/offline-wallet-view" \
            testDebugUnitTest lintDebug assembleDebug
          python3 scripts/verify-apk.py \
            --core-mobile-dir "$RUNNER_TEMP/core-mobile" \
            --offline-wallet-view-dir "$RUNNER_TEMP/offline-wallet-view"
          mkdir -p "$GITHUB_WORKSPACE/mobile-artifacts"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/mobile-artifacts/blocknet-wallet-arm64-mobile-debug.apk"
          cp "$RUNNER_TEMP/core-mobile/build-provenance.json" "$GITHUB_WORKSPACE/mobile-artifacts/"
          cp "$RUNNER_TEMP/core-mobile/mobile-client-policy.patch" "$GITHUB_WORKSPACE/mobile-artifacts/"
          cp "$RUNNER_TEMP/core-mobile/0005-core-wallet-persistence.patch" "$GITHUB_WORKSPACE/mobile-artifacts/"
          cp "$RUNNER_TEMP/core-mobile/0006-core-wallet-scan-serialization.patch" "$GITHUB_WORKSPACE/mobile-artifacts/"
          cp "$RUNNER_TEMP/core-mobile/0007-core-wallet-send-readiness.patch" "$GITHUB_WORKSPACE/mobile-artifacts/"
          cp "$RUNNER_TEMP/core-mobile/0008-core-wallet-send-reorg-activity.patch" "$GITHUB_WORKSPACE/mobile-artifacts/"
          cp "$RUNNER_TEMP/core-mobile/0009-core-wallet-notification-overflow.patch" "$GITHUB_WORKSPACE/mobile-artifacts/"
          cp "$RUNNER_TEMP/core-mobile/Cargo.lock" "$GITHUB_WORKSPACE/mobile-artifacts/"
          cp "$RUNNER_TEMP/offline-wallet-view/build-provenance.json" "$GITHUB_WORKSPACE/mobile-artifacts/offline-wallet-view-build-provenance.json"
          cd "$GITHUB_WORKSPACE/mobile-artifacts"
          sha256sum ./*.apk > SHA256SUMS

      - name: Upload mobile candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blocknet-wallet-arm64-mobile-debug
          path: mobile-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Upload mobile test and lint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-reports-mobile
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-debug.*
            android/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
  sign_release:
    name: Owner-signed mobile Core APK
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_release && startsWith(github.ref, 'refs/tags/v') && github.repository == 'crappyrules/blocknet-android' }}
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: android-release
    permissions:
      contents: read
    steps:
      - name: Check out the selected release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check tag and source commit before signing
        run: python3 android/scripts/verify_release_tag.py "$GITHUB_REF_NAME" "$GITHUB_SHA"

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5 (Node 24)

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4 (Node 24)
        with:
          cmdline-tools-version: '12266719'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.5'
          cache: false

      - name: Build reviewed native inputs
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+-preview\.[0-9]+$ ]]
          git init "$RUNNER_TEMP/blocknet-core-source"
          git -C "$RUNNER_TEMP/blocknet-core-source" remote add origin https://github.com/blocknetprivacy/core.git
          git -C "$RUNNER_TEMP/blocknet-core-source" fetch --depth 1 origin 5a37ed52f0426951eaac2f0ae86bf0bb6d70a83e
          git -C "$RUNNER_TEMP/blocknet-core-source" checkout --detach FETCH_HEAD
          bash android/scripts/build-offline-wallet-view.sh \
            "$RUNNER_TEMP/blocknet-core-source" "$RUNNER_TEMP/offline-wallet-view"
          sdkmanager 'ndk;30.0.16248370'
          rustup toolchain install 1.89.0 --profile minimal --target aarch64-linux-android
          export RUSTUP_TOOLCHAIN=1.89.0
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/30.0.16248370"
          bash android/scripts/build-core-android.sh \
            "$RUNNER_TEMP/blocknet-core-source" "$RUNNER_TEMP/core-mobile" \
            "$GITHUB_WORKSPACE/android/core-patches/0001-locked-wallet-activity.patch" \
            "$GITHUB_WORKSPACE/android/core-patches/0004-mobile-client-policy.patch"

      - name: Sign and verify release APK
        shell: bash
        env:
          OWNER_KEYSTORE_BASE64: ${{ secrets.BLOCKNET_RELEASE_KEYSTORE_B64 }}
          BLOCKNET_RELEASE_STORE_PASSWORD: ${{ secrets.BLOCKNET_RELEASE_STORE_PASSWORD }}
          BLOCKNET_RELEASE_KEY_PASSWORD: ${{ secrets.BLOCKNET_RELEASE_KEY_PASSWORD }}
          BLOCKNET_RELEASE_KEY_ALIAS: blocknet-release
          BLOCKNET_RELEASE_CERT_SHA256: 4a307e802e3504f7850c546ab8b38c292211ea5d5c5be3342107edaec1255fff
          BLOCKNET_ANNOUNCEMENT_PRIMARY_PUB: 333c7c85db80716deceb4da838b5ae3145ee4b0ed0a64966f60aa56e12972b16
          BLOCKNET_ANNOUNCEMENT_VIEW_PRIV: a887e975d9374b75fe36e4cd828f6333599f195b9fe2544b2329ffeb51300204
          BLOCKNET_ANNOUNCEMENT_SPEND_PUB: 8c66dd904be0ef4ecc9b48c3a4710af0b8a0b485387a9fbd7ffd64596eb6c34c
          BLOCKNET_ANNOUNCEMENT_BIRTH_HEIGHT: '66200'
          BLOCKNET_ANNOUNCEMENT_APK_CERT_SHA256: 4a307e802e3504f7850c546ab8b38c292211ea5d5c5be3342107edaec1255fff
        run: |
          set -euo pipefail
          set +x
          umask 077
          [[ -n "$OWNER_KEYSTORE_BASE64" && -n "$BLOCKNET_RELEASE_STORE_PASSWORD" && -n "$BLOCKNET_RELEASE_KEY_PASSWORD" ]] || {
            echo 'Protected owner signing secrets are missing' >&2
            exit 1
          }
          export BLOCKNET_RELEASE_KEYSTORE="$RUNNER_TEMP/blocknet-owner-release.p12"
          trap 'rm -f "$BLOCKNET_RELEASE_KEYSTORE"' EXIT
          printf '%s' "$OWNER_KEYSTORE_BASE64" | base64 --decode > "$BLOCKNET_RELEASE_KEYSTORE"
          cd android
          ./gradlew --no-daemon \
            -PcoreMobileDir="$RUNNER_TEMP/core-mobile" \
            -PofflineWalletViewDir="$RUNNER_TEMP/offline-wallet-view" \
            :app:assembleRelease
          apk=app/build/outputs/apk/release/app-release.apk
          python3 scripts/verify-apk.py \
            --core-mobile-dir "$RUNNER_TEMP/core-mobile" \
            --offline-wallet-view-dir "$RUNNER_TEMP/offline-wallet-view" "$apk"
          python3 scripts/verify_release_metadata.py "$apk" "$GITHUB_REF_NAME"
          python3 scripts/verify_release_tag.py "$GITHUB_REF_NAME" "$GITHUB_SHA"
          mkdir -p "$GITHUB_WORKSPACE/signed-release"
          cp "$apk" "$GITHUB_WORKSPACE/signed-release/blocknet-wallet-arm64-activity-release.apk"
          cp "$RUNNER_TEMP/core-mobile/build-provenance.json" "$GITHUB_WORKSPACE/signed-release/core-mobile-build-provenance.json"
          cp "$RUNNER_TEMP/offline-wallet-view/build-provenance.json" "$GITHUB_WORKSPACE/signed-release/offline-wallet-view-build-provenance.json"
          printf '%s\n' "$GITHUB_SHA" > "$GITHUB_WORKSPACE/signed-release/SOURCE_COMMIT"
          (cd "$GITHUB_WORKSPACE/signed-release" && sha256sum \
            blocknet-wallet-arm64-activity-release.apk core-mobile-build-provenance.json \
            offline-wallet-view-build-provenance.json SOURCE_COMMIT > SHA256SUMS)
          python3 scripts/verify_signed_mobile_artifact.py "$GITHUB_WORKSPACE/signed-release"

      - name: Upload owner-signed release for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24)
        with:
          name: blocknet-owner-signed-release
          path: signed-release/
          if-no-files-found: error
          retention-days: 30

  publish_release:
    name: Publish owner-signed APK
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_release && inputs.publish_release && inputs.confirm_publish_tag == github.ref_name && startsWith(github.ref, 'refs/tags/v') && github.repository == 'crappyrules/blocknet-android' }}
    needs: sign_release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: android-publish
    permissions:
      contents: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Download signed artifact from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 (Node 24)
        with:
          name: blocknet-owner-signed-release
          path: signed-release

      - name: Set up Android SDK verification tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4 (Node 24)
        with:
          cmdline-tools-version: '12266719'
          packages: 'build-tools;36.0.0'

      - name: Reverify exact signed artifact and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+-preview\.[0-9]+$ ]]
          (cd signed-release && sha256sum --check SHA256SUMS)
          [[ "$(cat signed-release/SOURCE_COMMIT)" == "$GITHUB_SHA" ]]
          python3 android/scripts/verify_release_metadata.py \
            signed-release/blocknet-wallet-arm64-activity-release.apk "$GITHUB_REF_NAME"
          python3 android/scripts/verify_signed_mobile_artifact.py signed-release
          python3 android/scripts/verify_release_tag.py "$GITHUB_REF_NAME" "$GITHUB_SHA"
          gh release create "$GITHUB_REF_NAME" \
            signed-release/blocknet-wallet-arm64-activity-release.apk \
            signed-release/SHA256SUMS signed-release/SOURCE_COMMIT \
            signed-release/core-mobile-build-provenance.json \
            signed-release/offline-wallet-view-build-provenance.json \
            --verify-tag --prerelease --title "Blocknet Android $GITHUB_REF_NAME" \
            --notes-file android/docs/OWNER_RELEASE_NOTES.md
